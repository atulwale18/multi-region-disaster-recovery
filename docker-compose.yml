services:
  primary:
    build: ./app
    container_name: dr-primary
    environment:
      REGION_NAME: primary
      DATA_FILE: /data/data.json
    volumes:
      - primary-data:/data
    ports:
      - "8081:5000"
    restart: unless-stopped
  recovery:
    build: ./app
    container_name: dr-recovery
    environment:
      REGION_NAME: recovery
      DATA_FILE: /data/data.json
    volumes:
      - recovery-data:/data
    ports:
      - "8082:5000"
    restart: unless-stopped
  proxy:
    image: nginx:1.27-alpine
    container_name: dr-proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/active-upstream.conf:/etc/nginx/conf.d/upstream.conf:ro
    depends_on:
      - primary
      - recovery
    restart: unless-stopped
volumes:
  primary-data:
  recovery-data:
